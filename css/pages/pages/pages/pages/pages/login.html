<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Muramba Enterprise Solutions</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                Muramba Transport
            </div>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="booking.html">Book a Service</a></li>
                <li><a href="tracking.html">Track Delivery</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>

        </nav>
    </header>

    <!-- Login Form -->
    <main>

        <section class="about-section">

            <h1>Login</h1>

            <p>
                Log in to access the Muramba Transport Management System.
            </p>

            <br>

            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <br><br>

                <label for="password">
                    Password
                </label>

                <br>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <br><br>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            <br>

            <p>
                Don't have an account?
                <a href="#">Register here</a>
            </p>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Muramba Enterprise Solutions.
            All rights reserved.
        </p>

    </footer>

    <script src="../js/script.js"></script>

</body>

</html>
